# Nginx del contenedor del frontend
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a la API van al contenedor del backend (hace lo mismo que el proxy de Vite en desarrollo)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: cualquier otra ruta (/mis-reservas, /charlas/1...) carga index.html
    location / {
        try_files $uri /index.html;
    }
}
