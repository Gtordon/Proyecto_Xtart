# Entorno completo de SABITECH WEB: base de datos, backend y frontend.
# Arrancar todo:          docker compose up -d --build   -> web en http://localhost:8080
# Solo la base de datos:  docker compose up -d db        (para desarrollar con php artisan serve y npm run dev)
services:
  db:
    image: mysql:8.4
    container_name: sabitech-db
    environment:
      MYSQL_DATABASE: sabitech
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: sabitech-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sabitech
      DB_USERNAME: root
      DB_PASSWORD: admin123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sabitech-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
